{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 border border-gray-300 shadow-lg rounded-lg mt-8">
    <h2 class="text-3xl font-bold text-gray-800 mb-2">Consultation Room</h2>
    <p class="text-lg text-blue-600 font-semibold mb-8">Patient: {{ patient.name }}</p>
    
    <form method="POST">
        <div class="mb-6">
            <label class="block text-gray-700 font-bold mb-2 text-xl">Clinical Notes</label>
            <p class="text-sm text-gray-600 mb-4 bg-yellow-50 p-3 rounded border border-yellow-200">
                <strong>AI Translation Active:</strong> Write your notes using standard medical terminology. Our AI will automatically translate this into a patient-friendly summary with medication instructions.
            </p>
            <textarea name="clinical_notes" rows="10" required class="w-full border rounded py-3 px-4 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="E.g., Pt presents with acute gastroenteritis. Vitals stable. Advised clear liquid diet for 24h. Rx: Ondansetron 4mg PRN for nausea..."></textarea>
        </div>
        
        <div class="flex justify-between items-center mt-8 pt-4 border-t">
            <a href="{{ url_for('doctor.dashboard') }}" class="text-gray-500 hover:text-gray-800 font-semibold">Cancel</a>
            <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded shadow-lg transition duration-200">
                Complete Consultation
            </button>
        </div>
    </form>
</div>
{% endblock %}
